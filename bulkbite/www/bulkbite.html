<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <title>BulkBite Operations</title>
    <style>
      body { margin: 0; background: #101010; color: #fff; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      section { max-width: 46rem; border: 2px solid #ff5a1f; padding: clamp(1.5rem, 5vw, 4rem); }
      h1 { margin: 0 0 1rem; color: #ff5a1f; font-family: Impact, sans-serif; font-size: clamp(2.8rem, 9vw, 6rem); line-height: .92; text-transform: uppercase; }
      p { font-size: 1.125rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>BulkBite operations</h1>
        <p>The custom stock service is ready. The interface is temporarily unavailable while its Desyium component and block owners are validated.</p>
      </section>
    </main>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
