server {
    listen 80;
    listen [::]:80;
    server_name admin.bulkbite.co.za;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.huispunte.co.za;

    location / {
        return 301 https://admin.bulkbite.co.za$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.huispunte.co.za;

    ssl_certificate /etc/letsencrypt/live/admin.huispunte.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.huispunte.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://admin.bulkbite.co.za$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.bulkbite.co.za;

    ssl_certificate /etc/letsencrypt/live/admin.bulkbite.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bulkbite.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    location = / {
        return 302 /bulkbite;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8088;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8088;
    }
}
